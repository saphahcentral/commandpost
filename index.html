<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 6px;
            background-color: #161b22;
            max-width: 500px;
        }
        h1 {
            font-size: 24px;
            color: #f85149;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            line-height: 1.5;
        }
        .system-id {
            margin-top: 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 10px;
            color: #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>403 Forbidden</h1>
        <p>Access to this resource is restricted by the system administrator.</p>
        <p>Unauthorized access attempts are logged and reported.</p>
        <div class="system-id">ID: ELIYAH-COMMAND-POST-SECURE</div>
    </div>
</body>
</html>
