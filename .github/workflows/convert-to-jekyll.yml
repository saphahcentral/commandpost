name: Jekyll Front Matter Conversion

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout COMMANDPOST
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run converter
        env:
          ELIYAH_SAPHAH: ${{ secrets.ELIYAH_SAPHAH }}
        run: node convert-to-jekyll.js
